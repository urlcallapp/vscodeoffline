version: '3'
services:

  vscsync:
    image: vscodeoffline-sync:local
    build:
      context: ./
      dockerfile: ./vscoffline/vscsync/Dockerfile
    dns:
      - 1.1.1.1
    volumes:
      - ./artifacts/:/artifacts/
    environment:
      - SYNCARGS=--sync
      # Enable to sync all extensions
      #- SYNCARGS=--syncall
      # Enable a logfile
      #- SYNCARGS=--sync --logfile /logs/sync.log

  vscgallery:
    image: vscodeoffline-gallery:local
    build:
      context: ./
      dockerfile: ./vscoffline/vscgallery/Dockerfile
    volumes:
      - ./artifacts/:/artifacts/
      # Required: supply your organization-issued certificate and private key.
      - ./tls/:/run/tls/:ro
      # Enable to store logfiles in its own folder
      # ./logs/:/logs/
    ports:
      - 443:443
    environment:
      - BIND=0.0.0.0:443
