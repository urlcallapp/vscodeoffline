name: Verify
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -r vscoffline/vscsync/requirements.txt -r vscoffline/vscgallery/requirements.txt pytest
      - run: python -m pytest -q tests
      - run: python -m compileall -q vscoffline
  containers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f vscoffline/vscsync/Dockerfile -t vscodeoffline-sync:test .
      - run: docker build -f vscoffline/vscgallery/Dockerfile -t vscodeoffline-gallery:test .
      - name: Gallery container smoke, no TLS or external services
        run: |
          docker run -d --name gallery -p 127.0.0.1:8080:8080 -e BIND=0.0.0.0:8080 -e SSLARGS= vscodeoffline-gallery:test
          for i in $(seq 1 30); do
            if curl --fail http://127.0.0.1:8080/api/catalog; then exit 0; fi
            sleep 1
          done
          docker logs gallery
          exit 1
      - if: always()
        run: docker rm -f gallery || true
